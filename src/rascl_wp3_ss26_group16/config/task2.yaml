wp3_tsk2:
  ros__parameters:
    # Tutor/task-sheet input: Cartesian geometry_msgs/msg/Point.
    cartesian_cube_topic: "/goal_poses"
    # Accepted Cartesian pose republished for visualization/consumers.
    goal_pose_topic: "/goal_pose"

    trajectory_action: "/joint_trajectory_controller/follow_joint_trajectory"
    joint_state_topic: "/joint_states"
    sample_period: 0.02
    # Duration of each minimum-jerk waypoint transition.
    segment_duration: 4.0
    simulate_only: false

    # Feasible Cartesian cube-position limits (metres).
    # x: -400 to 400 mm; y: 30 to 320 mm.
    minimum_x: -0.40
    maximum_x: 0.40
    minimum_y: 0.03
    maximum_y: 0.32

    # Fixed placement TCP position: x=165 mm, y=50 mm, z=38 mm.
    target_x: 0.165
    target_y: 0.05
    target_z: 0.038
    # Closed-gripper TCP waypoint before placement. The robot moves here first,
    # then slides to the fixed placement TCP position before opening.
    pre_place_x: 0.215
    pre_place_y: 0.05
    pre_place_z: 0.045
    # TCP grasp target relative to the incoming cube center. Fixed placement
    # coordinates above are already TCP coordinates and do not use this offset.
    tcp_offset_from_cube_center_z: 0.007
    approach_height: 0.08

    # URDF-based Robotics Toolbox IK configuration.
    robotics_toolbox_tcp_offset: [0.0, 0.038, 0.0]
    # Convert Task 2 x/y targets into the URDF frame used by Robotics Toolbox.
    # -pi/2 maps task (x, y) to toolbox (y, -x).
    robotics_toolbox_theta_offset: -1.570796327
    robotics_toolbox_gripper_seed_position: 0.0

    # Same end-effector commands currently used by Task 1.
    gripper_open_position: 0.0
    gripper_closed_position: 2.0
    home_positions: [0.0, 0.0, 0.0, 0.0]
