wp3_tsk2:
  ros__parameters:
    # Tutor/task-sheet input: Cartesian geometry_msgs/msg/Point.
    cartesian_cube_topic: "/goal_poses"
    # Accepted Cartesian pose republished for visualization/consumers.
    goal_pose_topic: "/goal_pose"

    trajectory_action: "/joint_trajectory_controller/follow_joint_trajectory"
    joint_state_topic: "/joint_states"
    sample_period: 0.02
    # Duration of each minimum-jerk waypoint transition.
    segment_duration: 4.0
    simulate_only: false

    # Feasible Cartesian cube-position limits (metres).
    # x: -250 to 250 mm; y: 30 to 250 mm.
    minimum_x: -0.25
    maximum_x: 0.25
    minimum_y: 0.03
    maximum_y: 0.25

    # Fixed target position: x=250 mm, y=30 mm.
    target_x: 0.25
    target_y: 0.03
    # Fixed target cube-center height. For a 41 mm cube on the plate, the
    # center is 20.5 mm above base_link z=0.
    target_z: 0.0205
    cube_height: 0.041
    # TCP target relative to the cube center. Zero means the TCP should go to
    # the cube center itself.
    tcp_offset_from_cube_center_z: 0.01
    approach_height: 0.08

    # Dimensions
    # Shoulder pitch axis: 57.441 mm + 65.560 mm above base_link.
    shoulder_height: 0.123001
    # Planar axis distances: hypot(170, 80) mm and 129.09 mm.
    upperarm_length: 0.1878829423
    lowerarm_length: 0.12909

    # TCP at the center of the gripper: 30 mm below the end-effector midpoint
    # along the tool's local vertical axis. The offset rotates with the tool.
    radial_tool_offset: 0.0
    vertical_tool_offset: -0.045
    tool_pitch_offset: 0.0
    # This branch matches the arm's folded mechanical-zero configuration.
    elbow_up: True

    # Joint-coordinate mapping for the current URDF axis conventions.
    shoulder_sign: -1.0
    # The arm's zero direction is +y; offset by 90 degrees to use base_link x/y.
    shoulder_offset: 1.570796327
    upperarm_sign: 1.0
    # At motor zero, the upper link is 1.11773 rad above the radial plane.
    upperarm_offset: -1.1177305070
    lowerarm_sign: -1.0
    # Relative geometric elbow angle at motor zero is -1.11694 rad.
    lowerarm_offset: -1.1169401780

    # Same end-effector commands currently used by Task 1.
    gripper_open_position: 0.0
    gripper_closed_position: 2.5
    home_positions: [0.0, 0.0, 0.0, 0.0]
